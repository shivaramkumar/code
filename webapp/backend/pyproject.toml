[project]
name = "learnspace-ai-backend"
version = "0.1.0"
description = "Educational AI Backend leveraging FastAPI and Azure Serverless"
requires-python = ">=3.9"
dependencies = [
    "azure-functions",
    "chromadb",
    "fastapi",
    "httpx",
    "pydantic-settings",
    "python-multipart",
    "sqlalchemy",
    "sse-starlette",
    "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120
