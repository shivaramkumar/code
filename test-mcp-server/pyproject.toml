[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "template-mcp-server"
version = "0.1.0"
description = "MCP server with HTTP/SSE transport for Jinja2 template generation, sensor/actor model comparison, field-retaining migration, git submodule tracking, and client audit trails"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Developer" }
]
dependencies = [
    "mcp>=2.2.0",
    "jinja2>=3.1.6",
    "pydantic>=2.13.0",
    "pyyaml>=6.0.2",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
template-mcp-server = "template_mcp_server.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"template_mcp_server" = ["templates/**/*"]
